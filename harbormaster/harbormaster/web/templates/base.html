<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Harbormaster — landed cost and tariff recovery for importers{% endblock %}</title>
  <meta name="description" content="{% block description %}Harbormaster recomputes every tariff layer on every customs entry, recovers what you overpaid, and keeps every product's landed cost and margin current.{% endblock %}">
  <meta name="csrf-token" content="{{ csrf }}">
  <meta name="htmx-config" content='{"includeIndicatorStyles": false, "allowEval": false, "responseHandling": [{"code": "204", "swap": false}, {"code": "[23]..", "swap": true}, {"code": "[45]..", "swap": true, "error": true}]}'>
  <meta property="og:title" content="Harbormaster">
  <meta property="og:description" content="Know what every product really costs to land. Get back what you overpaid.">
  <link rel="icon" href="/static/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,500&display=swap">
  <link rel="stylesheet" href="/static/css/harbormaster.css">
  <script src="/static/vendor/htmx.min.js" defer></script>
  <script src="/static/js/app.js" defer></script>
</head>
<body>
{% block body %}{% endblock %}
</body>
</html>
