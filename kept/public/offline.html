<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Offline · Kept</title>
<style>
  :root { --bg: #f3f6f2; --ink: #10231b; --muted: #5b6b63; --brand: #0b5d45; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0e1512; --ink: #e8efe9; --muted: #9db0a5; --brand: #4fc79a; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, sans-serif; padding: 16px; }
  main { max-width: 380px; text-align: center; }
  h1 { font-size: 1.5rem; margin: 16px 0 6px; }
  p { color: var(--muted); }
  a { color: var(--brand); font-weight: 700; }
</style></head>
<body><main>
  <img src="/icon.svg" width="56" height="56" alt="">
  <h1>You're offline</h1>
  <p>Kept will be right here when you're back online. If it's dose day, take your dose as usual and log it later — the time you enter is what counts.</p>
  <p><a href="/app">Try again</a></p>
</main></body></html>
